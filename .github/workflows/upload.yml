name: Publish component

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production approval policy
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tag and production policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate_release.sh
      - name: Test release policy
        run: bash .github/scripts/test_release_policy.sh
      - name: Verify the tag matches the component version
        id: version
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' idf_component.yml)
          expected_tag="v${version/\~/.}"
          if [[ -z "$version" || "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            printf 'Expected tag %s for Registry version %s\n' "$expected_tag" "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  test:
    needs: validate
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository] actionlint 1.7.12 supports relative workflow paths

  package:
    needs: [validate, test]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      archive-sha256: ${{ steps.pack.outputs.archive-sha256 }}
      version: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Package and inspect the component
        id: pack
        run: |
          source_sha=$(git rev-parse HEAD)
          python -m pip install -r .github/requirements.txt
          compote component pack --name mrubyc-esp32 --dest-dir dist \
            --repository "https://github.com/$GITHUB_REPOSITORY.git" --commit-sha "$source_sha"
          archive=(dist/*.tgz)
          python tools/check_package.py --commit-sha "$GITHUB_SHA" "${archive[@]}"
          digest=$(sha256sum "${archive[0]}")
          printf 'archive-sha256=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: registry-package
          retention-days: 35
          path: dist/*.tgz
          if-no-files-found: error

  staging:
    runs-on: ubuntu-26.04
    needs: package
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: dist
          digest-mismatch: error
      - name: Publish the package to staging via OIDC
        env:
          ARCHIVE_SHA256: ${{ needs.package.outputs.archive-sha256 }}
        run: |
          archive=(dist/*.tgz)
          printf '%s  %s\n' "$ARCHIVE_SHA256" "${archive[0]}" | sha256sum --check
          python -m pip install -r .github/requirements.txt
          python tools/upload_package.py --staging "${archive[@]}"

  staging-smoke:
    runs-on: ubuntu-26.04
    needs: [package, staging]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build a consumer of the exact staged version
        env:
          VERSION: ${{ needs.package.outputs.version }}
          IMAGE: espressif/idf:v6.1.1@sha256:2b4f966c37eaedc19542b0637a5f850b2eff9478d8e858192aa0073d92c2dc91
        run: |
          docker run --init --rm --pull=missing \
            -v "$GITHUB_WORKSPACE:/work/mrubyc-esp32:ro" -w /work/mrubyc-esp32 \
            "$IMAGE" bash tools/smoke_registry.sh "$VERSION"

  production:
    runs-on: ubuntu-26.04
    needs: [package, staging-smoke]
    environment: production
    permissions:
      actions: read
      contents: write # The Releases API only returns drafts to callers with push access.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck production policy and require a new Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate_release.sh --publish-check
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: dist
          digest-mismatch: error
      - name: Verify the staged archive before attestation
        env:
          ARCHIVE_SHA256: ${{ needs.package.outputs.archive-sha256 }}
        run: |
          archive=(dist/*.tgz)
          printf '%s  %s\n' "$ARCHIVE_SHA256" "${archive[0]}" | sha256sum --check
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz
      - name: Publish the attested package via OIDC
        run: |
          python -m pip install -r .github/requirements.txt
          python tools/upload_package.py dist/*.tgz

  release:
    runs-on: ubuntu-26.04
    needs: [package, production]
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck production policy and require a new Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate_release.sh --publish-check
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: dist
          digest-mismatch: error
      - name: Publish the GitHub release
        env:
          ARCHIVE_SHA256: ${{ needs.package.outputs.archive-sha256 }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=(dist/*.tgz)
          printf '%s  %s\n' "$ARCHIVE_SHA256" "${archive[0]}" | sha256sum --check
          gh release create "$GITHUB_REF_NAME" "${archive[@]}" --verify-tag --generate-notes
