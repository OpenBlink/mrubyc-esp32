name: Publish component

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      staging:
        description: Publish this checkout to the staging Registry
        type: boolean
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'push' || inputs.staging
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Package and inspect the component
        run: |
          python -m pip install -r .github/requirements.txt
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' idf_component.yml)
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag does not match the manifest version" >&2
            exit 1
          fi
          compote component pack --name mrubyc-esp32 --dest-dir dist \
            --repository "https://github.com/$GITHUB_REPOSITORY.git" --commit-sha "$GITHUB_SHA"
          python tools/check_package.py dist/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-package
          path: dist/*.tgz
          if-no-files-found: error

  staging:
    if: github.event_name == 'workflow_dispatch' && inputs.staging && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    needs: package
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: espressif/upload-components-ci-action@2ce17d73e35473317c1419dbd4f007aacb593040 # v2.2.1
        with:
          namespace: openblink
          components: "mrubyc-esp32: ."
          registry_url: https://components-staging.espressif.com
          repository_url: https://github.com/OpenBlink/mrubyc-esp32.git

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: package
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-package
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz
      - name: Publish the attested package via OIDC
        run: |
          python -m pip install -r .github/requirements.txt
          python tools/upload_package.py dist/*.tgz
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tgz --verify-tag --generate-notes
          fi
